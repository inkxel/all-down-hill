  { t: 0.80, top: 0x05060f, bot: 0x121a34, glow: 0x2a3a63, gi: 0.35, sun: 0x93aade, si: 0.62, hs: 0x2a3760, hg: 0x141a30, hi: 0.42, amb: 0x2e3d6c, ai: 0.28, star: 1.00, elev: 0.62, snow: 0xc9d6ee, mtn: 0x161b32 },
  { t: 0.92, top: 0x0d1330, bot: 0x4a3560, glow: 0x8a5a72, gi: 0.55, sun: 0xb08fc4, si: 1.10, hs: 0x4a3560, hg: 0x312a58, hi: 0.90, amb: 0x413c72, ai: 0.42, star: 0.62, elev: 0.06, snow: 0xdfd9ea, mtn: 0x2b2b52 },
  { t: 1.00, top: 0x22315e, bot: 0xf6b6a4, glow: 0xffcfa0, gi: 0.95, sun: 0xffc4a3, si: 2.40, hs: 0xf6b6a4, hg: 0x6d719c, hi: 1.55, amb: 0x6a76a4, ai: 0.45, star: 0.35, elev: 0.16, snow: 0xfff2ee, mtn: 0x55598c }
];

const _cB = new THREE.Color();
const skyBot = new THREE.Color();
const mtnCol = new THREE.Color();
const sunDir = new THREE.Vector3(0, 1, 0);
let starAmt = 0;

function mixHex(ha, hb, u, out) { return out.setHex(ha).lerp(_cB.setHex(hb), u); }

function applyDay(dayT) {
  let i = 0;
  while (i < DAY.length - 2 && DAY[i + 1].t <= dayT) i++;
  const a = DAY[i], b = DAY[i + 1];
  const u = clamp((dayT - a.t) / Math.max(1e-6, b.t - a.t), 0, 1);

  mixHex(a.top, b.top, u, skyMat.uniforms.uTop.value);
  mixHex(a.bot, b.bot, u, skyBot);
  skyMat.uniforms.uBot.value.copy(skyBot);
  mixHex(a.glow, b.glow, u, skyMat.uniforms.uGlow.value);
  skyMat.uniforms.uGlowI.value = lerp(a.gi, b.gi, u);

  mixHex(a.sun, b.sun, u, sunLight.color);
  sunLight.intensity = lerp(a.si, b.si, u);
  mixHex(a.hs, b.hs, u, hemiLight.color);
  mixHex(a.hg, b.hg, u, hemiLight.groundColor);
  hemiLight.intensity = lerp(a.hi, b.hi, u);
  mixHex(a.amb, b.amb, u, ambLight.color);
  ambLight.intensity = lerp(a.ai, b.ai, u);

  starAmt = lerp(a.star, b.star, u);
  starMat.opacity = starAmt;
  stars.visible = starAmt > 0.01;

  mixHex(a.snow, b.snow, u, snowMat.color);
  propMat.color.copy(snowMat.color).lerp(_cB.setRGB(1, 1, 1), 0.42);

  mixHex(a.mtn, b.mtn, u, mtnCol);

  // sun / moon direction
  const elev = lerp(a.elev, b.elev, u);
  const th = elev * Math.PI * 0.5;
  const az = -1.05 + dayT * 1.2;   // narrow arc: sun/moon stays ahead of the fall line all cycle
  sunDir.set(Math.cos(az) * Math.cos(th), Math.max(0.035, Math.sin(th)), Math.sin(az) * Math.cos(th)).normalize();
  skyMat.uniforms.uSun.value.copy(sunDir);
  sunLight.position.copy(sunDir).multiplyScalar(200);
  sunLight.target.position.set(0, 0, 0);

  sunSprite.material.opacity = 1 - starAmt;
  sunSprite.material.color.copy(sunLight.color);
  moonSprite.material.opacity = starAmt;
  sunSprite.visible = sunSprite.material.opacity > 0.02;
  moonSprite.visible = moonSprite.material.opacity > 0.02;

  for (let m = 0; m < mtnMeshes.length; m++) {
    mtnMeshes[m].material.color.copy(mtnCol).lerp(skyBot, MTN_LAYERS[m].mix);
  }
}

/* ------------------------------- weather -------------------------------- */

const WEATHER = [
  { name: 'clear', snow: 0.00, fog: 1.00, wind: 0.0, size: 0.26 },
  { name: 'light', snow: 0.38, fog: 0.86, wind: 0.6, size: 0.28 },
  { name: 'heavy', snow: 1.00, fog: 0.55, wind: 1.4, size: 0.34 },
  { name: 'windy', snow: 0.55, fog: 0.74, wind: 5.6, size: 0.24 }
];
let wNext = 0, wTimer = 26;
let wSnow = 0, wFog = 1, wWind = 0, wSize = 0.26, wsVisible = 0;

function updateWeather(dt) {
  wTimer -= dt;
  if (wTimer <= 0) {
    let n = wNext;
    while (n === wNext) n = (Math.random() * WEATHER.length) | 0;
    wNext = n;
    wTimer = 22 + Math.random() * 20;
  }
  const T = WEATHER[wNext];
  wSnow = damp(wSnow, T.snow, 0.30, dt);
  wFog  = damp(wFog,  T.fog,  0.30, dt);
  wWind = damp(wWind, T.wind, 0.30, dt);
  wSize = damp(wSize, T.size, 0.30, dt);

  wsMat.opacity = clamp(wSnow * 0.92, 0, 1);
  wsMat.size = wSize;
  wsVisible = Math.floor(WSNOW_N * clamp(wSnow * 1.15, 0, 1));
  wsGeo.setDrawRange(0, wsVisible);
  wsnow.visible = wsVisible > 0;
}

/* ====================================================================== */
/*  GAME STATE                                                             */
/* ====================================================================== */

let state = 'title';           // title | ride | crash
let started = false;
let realT = 0, dayT = 0, timeScale = 1, slowT = 0;
let survivalT = 0;
let score = 0, mult = 1, distance = 0;
let vx = 0, vy = 0, fwd = SPD_BASE;
let grounded = true, flipRot = 0, rollRot = 0, spinAxis = 0;
let jumpPressed = false, compress = 0;
let chain = 0;                    // links banked on the next clean landing
let grinding = false, grindX = 0, grindEndZ = 0, grindAcc = 0;
let springT = 0;                  // brief pass-through so one obstacle cannot bounce you twice
let steerFromTilt = false;
let hopX = 0, hopT = 0;           // gentle lateral aim while hopping onto a log
let armedSpin = 0, armedT = 0;   // spin axis of the kicker you were last on
const MAX_CONTINUES = 3;
let continuesLeft = MAX_CONTINUES, runBestMult = 1;
let boostT = 0, crashT = 0, shake = 0, hitFlash = 0, graceT = 0;
let camLagX = 0, camLagY = 0, camLagZ = 0, camFov = 62, spdT = 0;
let camTgtX = 0, camTgtY = 0, camTgtZ = 0;
let bankCur = 0;
let hudAcc = 0, lastScoreTxt = '', lastDistTxt = '', lastMultTxt = '';

player.position.set(0, 0, -25);
player.position.y = groundAt(0, -25);
trailOrigin.copy(player.position);
trail.position.copy(trailOrigin);
sprayOrigin.copy(player.position);
spray.position.copy(sprayOrigin);
camLagX = 0; camLagY = player.position.y + 5; camLagZ = player.position.z + 10;
camTgtX = 0; camTgtY = player.position.y + 1.2; camTgtZ = player.position.z - 12;
for (let i = 0; i < TRAIL_N * 2; i++) {
  trailPos[i * 3] = 0; trailPos[i * 3 + 1] = 0; trailPos[i * 3 + 2] = 0;
  trailA[i] = 0;
}

/* ------------------------------- helpers -------------------------------- */

function saveBest() {
  if (score > bestScore) bestScore = Math.floor(score);
  try { localStorage.setItem('adh_best', String(Math.floor(bestScore))); } catch (e) { /* ignore */ }
}

function burst(n, power) {
  const px = player.position.x, py = player.position.y, pz = player.position.z;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, r = Math.random();
    emitSpray(
      px + (Math.random() - 0.5) * 1.4, py + 0.15 + Math.random() * 0.5, pz + (Math.random() - 0.5) * 1.4,
      Math.cos(a) * r * power, 1.5 + Math.random() * power, Math.sin(a) * r * power - fwd * 0.18,
      0.10 + Math.random() * 0.16, 0.5 + Math.random() * 0.7
    );
  }
}

function doCrash() {
  if (state !== 'ride') return;
  state = 'crash';
  crashT = 1.15;
  shake = Math.min(0.65, 0.30 + fwd * 0.006);
  hitFlash = 0.55;
  chain = 0;
  grinding = false;
  burst(isTouch ? 26 : 48, 7);
  thud(1.35);
  saveBest();
  el.crash.classList.add('on');
  el.mult.classList.remove('on');
}

// Y/N only means something to someone with a keyboard.
const usingTouch = () => isTouch || sawTouch;

function showWipe() {
  state = 'wiped';
  clearInput();                 // a touch held through the crash must not carry over
  el.crash.classList.remove('on');
  const touch = usingTouch();
  el.wScore.textContent = Math.floor(score).toLocaleString('en-US');
  el.wMeta.textContent = Math.floor(distance) + ' M  ·  BEST ×' + runBestMult;
  if (continuesLeft > 0) {
    el.wQ.textContent = touch
      ? 'Keep going?  ' + continuesLeft + ' left'
      : 'Keep going?  Y / N  ·  ' + continuesLeft + ' left';
    el.btnY.style.display = '';
    el.btnY.textContent = touch ? 'Keep going' : 'Y · Keep going';
    el.btnN.textContent = touch ? 'End run' : 'N · End run';
  } else {
    el.wQ.textContent = 'No continues left';
    el.btnY.style.display = 'none';
    el.btnN.textContent = touch ? 'See your runs' : 'N · See your runs';
  }
  el.wipe.classList.add('on');
}

function keepGoing() {
  if (continuesLeft <= 0) return;
  clearInput();
  continuesLeft--;
  el.wipe.classList.remove('on');
  respawn();
  graceT = 3.0;               // you asked for three seconds of grace
}

function endRun() {
  el.wipe.classList.remove('on');
  saveBest();
  const s0 = Math.floor(score);
  if (s0 > 0) {
    runs.push({ s: s0, d: Math.floor(distance), m: runBestMult, t: Date.now() });
    runs.sort((a, b) => b.s - a.s);
    runs = runs.slice(0, 5);
    try { localStorage.setItem('adh_runs', JSON.stringify(runs)); } catch (e) { /* ignore */ }
  }
  renderBoard();
  state = 'board';
  el.hud.classList.remove('on');
  el.board.classList.add('on');
}

function renderBoard() {
  el.btnAgain.textContent = usingTouch() ? 'Ride again' : 'Ride again  ·  ENTER';
  el.lbList.textContent = '';
  if (!runs.length) {
    const li = document.createElement('li');
    li.textContent = 'No runs yet';
    el.lbList.appendChild(li);
    return;
  }
  for (let i = 0; i < runs.length; i++) {
    const r = runs[i];
    const li = document.createElement('li');
    if (i === 0) li.className = 'top';
    const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = String(i + 1);
    const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = r.s.toLocaleString('en-US');
    const ds = document.createElement('span'); ds.className = 'ds'; ds.textContent = r.d + ' M  ·  ×' + r.m;
    li.appendChild(rk); li.appendChild(sc); li.appendChild(ds);
    el.lbList.appendChild(li);
  }
}

function pauseGame() {
  if (state !== 'ride') return;
  state = 'paused';
  clearInput();
  el.pauseHint.textContent = usingTouch() ? 'Tap to resume' : 'Press ENTER to resume';
  el.pause.classList.add('on');
}

function resumeGame() {
  if (state !== 'paused') return;
  el.pause.classList.remove('on');
  clearInput();
  if (tiltOn) { needBaseline = true; tiltSettle = 0.6; }   // they may have moved the phone
  graceT = Math.max(graceT, 0.4);
  state = 'ride';
}

function newRun() {
  clearInput();
  el.board.classList.remove('on');
  el.wipe.classList.remove('on');
  continuesLeft = MAX_CONTINUES;
  runBestMult = 1;
  score = 0; distance = 0;
  respawn();
  graceT = 1.2;
  el.hud.classList.add('on');
}

// Clipping an obstacle in the air relaunches you and adds a link to the chain.
function springOff(up, power) {
  vy = Math.max(vy, 0) + up;
  springT = 0.28;
  grounded = false;
  if (chain < CHAIN_CAP) chain++;
  compress = Math.min(1, compress + 0.3);
  shake = Math.max(shake, 0.06 + power * 0.10);
  burst(isTouch ? 8 : 16, 2.5 + power * 3);
  thud(0.30 + power * 0.4);
}

function land(impactVy) {
  const wrap = a => { a %= 360; if (a > 180) a -= 360; else if (a < -180) a += 360; return a; };
  const offPitch = wrap(flipRot), offRoll = wrap(rollRot);
  const flips = Math.round(flipRot / 360), rolls = Math.round(Math.abs(rollRot) / 360);

  if (Math.abs(offPitch) > LAND_TOL || Math.abs(offRoll) > ROLL_TOL) {
    flipRot = 0; rollRot = 0; spinAxis = 0;
    doCrash();
    return;
  }

  grounded = true;
  vy = 0;
  flipRot = 0; rollRot = 0; spinAxis = 0;
  boostT = BOOST_TIME;
  const power = clamp(Math.abs(impactVy) / 22, 0.2, 1.2);
  compress = Math.min(1, 0.35 + power);
  shake = Math.max(shake, 0.05 + power * 0.16);
  thud(0.45 + power * 0.8);
  burst(isTouch ? 10 : 20, 3 + power * 4);

  const tricks = flips + rolls * 2 + chain;   // rolls are worth more; chain links stack
  if (tricks >= 1) {
    mult = Math.min(9, mult + tricks);
    runBestMult = Math.max(runBestMult, mult);
    // a longer chain is worth more per link, not just more links
    score += tricks * 260 * mult * (1 + chain * 0.35);
    slowT = 0.42;
    el.mult.classList.add('on');
  }
  chain = 0;
}

function respawn() {
  state = 'ride';
  el.crash.classList.remove('on');
  vx = 0; vy = 0; flipRot = 0; rollRot = 0; spinAxis = 0; boostT = 0; compress = 0; chain = 0; springT = 0; hopT = 0;
  grinding = false; grindAcc = 0;
  survivalT = 0; mult = 1;
  graceT = 0.9;   // respawning inside the tree you just hit is not a death you can avoid
  bankCur = 0;
  bank.rotation.z = 0; flip.rotation.x = 0;
  body.position.y = -0.58; body.scale.y = 1;
  player.position.x = clamp(player.position.x, -18, 18);
  player.position.y = groundAt(player.position.x, player.position.z);
  grounded = true;
  if (tiltOn) { needBaseline = true; tiltSettle = 0.6; }
  for (let i = 0; i < TRAIL_N * 2; i++) trailA[i] = 0;
}

/* ====================================================================== */
/*  SIMULATION                                                             */
/* ====================================================================== */

const _up = new THREE.Vector3(0, 1, 0);
const _qAlign = new THREE.Quaternion();
const _qYaw = new THREE.Quaternion();
const _qTgt = new THREE.Quaternion();
const _right = new THREE.Vector3();
const _norm = new THREE.Vector3();

function simulate(dt) {
  const px0 = player.position.x, py0 = player.position.y, pz0 = player.position.z;

  // Smooth the sensor before it becomes input — raw gamma is jittery enough that
  // a wobble read as a hard carve.
  if (tiltOn && tiltBase !== null) {
    let d = tiltRaw - tiltBase;
    while (d > 180) d -= 360;
    while (d < -180) d += 360;
    tiltAngle = damp(tiltAngle, d, TILT_SMOOTH, dt);
  }

  /* ---- forward speed ---- */
  if (state === 'ride') {
    survivalT += dt;
  }
  const ramp = clamp(survivalT / SPD_RAMP, 0, 1);
  let target = SPD_BASE + (SPD_MAX - SPD_BASE) * ramp;
  if (boostT > 0) {
    boostT -= dt;
    target *= 1 + (BOOST_MUL - 1) * clamp(boostT / 0.4, 0, 1);
  }
  if (state === 'crash') target = 0;

  // gentle gradient influence so steeps read faster than flats
  const gradZ = (terrainHeight(px0, pz0 - 6) - terrainHeight(px0, pz0 + 6)) / 12;
  target *= clamp(1 + (-gradZ - SLOPE) * 0.55, 0.85, 1.16);
  fwd = damp(fwd, target, state === 'crash' ? 2.4 : 1.6, dt);

  /* ---- lateral ---- */
  let inp = state === 'ride' ? steerInput() : (state === 'title' ? Math.sin(realT * 0.34) * 0.75 : 0);
  if (!grounded) inp *= AIR_STEER;

  if (steerFromTilt) {
    // Acceleration control turns tilt into a double integrator, which is what
    // made it so hard to place the rider. Tilt sets a target lateral speed.
    vx = damp(vx, inp * STEER_MAX, 5.5, dt);
  } else if (inp !== 0) {
    vx += inp * STEER_ACC * dt;
  } else {
    const f = STEER_FRIC * dt;
    if (Math.abs(vx) <= f) vx = 0; else vx -= Math.sign(vx) * f;
  }
  // soft out-of-bounds nudge
  const over = Math.abs(px0) - PLAY_HALF;
  if (over > 0) vx -= Math.sign(px0) * over * 0.9 * dt * 8;
  vx = clamp(vx, -STEER_MAX, STEER_MAX);

  // While hopping onto a log, ease toward its line — the lateral timing was the
  // hard half of landing one. Player input still wins.
  if (hopT > 0) {
    hopT -= dt;
    if (grounded || grinding) hopT = 0;
    else player.position.x = damp(player.position.x, hopX, inp === 0 ? 6.5 : 2.2, dt);
  }

  player.position.x += vx * dt;
  player.position.z -= fwd * dt;

  if (state === 'ride') {
    distance += fwd * dt;
    score += fwd * dt * 0.55 * mult;
  }

  const px = player.position.x, pz = player.position.z;

  /* ---- vertical ---- */
  const gy = groundAt(px, pz);
  const logY = terrainHeight(px, pz) + LOG_H;
  // groundAt just queried (px, pz), so _rampSpin belongs to the ground underfoot.
  // An angled kicker gets crossed diagonally and you often leave through its side
  // a frame or two before the launch fires, so remember it briefly.
  if (_rampSpin !== 0) { armedSpin = _rampSpin; armedT = 0.30; }
  else if (armedT > 0) armedT -= dt;

  if (grinding) {
    // Locked to the log: height, line and lateral drift all come from the log,
    // and the only way off is a jump before it runs out.
    player.position.y = logY;
    vy = 0;
    grounded = true;
    player.position.x = damp(player.position.x, grindX, 12, dt);
    vx = damp(vx, 0, 10, dt);

    grindAcc += dt;
    if (grindAcc >= GRIND_LINK) {
      grindAcc -= GRIND_LINK;
      if (chain < CHAIN_CAP) chain++;
    }
    score += fwd * dt * 1.6 * mult;      // grinding pays while you hold it

    if (state === 'ride' && jumpPressed) {
      // Popping off the end is the skilled exit and pays double.
      grinding = false;
      grounded = false;
      vy = JUMP_POP + 5.5;
      chain = Math.min(CHAIN_CAP, chain + 2);
      boostT = BOOST_TIME * 0.6;
      whoosh();
      burst(isTouch ? 8 : 16, 3);
    } else if (pz < grindEndZ) {
      // Rolling off the end just drops you back to the snow. Mounting late used
      // to leave no room to jump, making the grind an unavoidable crash.
      grinding = false;
      grounded = false;
      vy = 0;
    }
  } else if (grounded) {
    const prevGy = groundAt(px0, pz0);
    // Clamped: any one-frame step in ground height (a ramp edge, a rebuilt
    // chunk) would otherwise read as a colossal upward throw.
    const surfVy = clamp(dt > 1e-5 ? (gy - prevGy) / dt : 0, -55, SURF_VY_MAX);
    player.position.y = gy;
    vy = surfVy;

    // Alto's model: no charge. Pressing jump adds a hop to whatever upward
    // surface velocity you already carry, so timing the lip is the whole skill.
    if (state === 'ride' && jumpPressed) {
      grounded = false;
      spinAxis = armedT > 0 ? armedSpin : 0;
      if (logAhead(px, pz)) {
        // Aim the hop at the log instead of throwing a full jump: solve the
        // vertical speed that puts the rider on the deck as they reach it.
        // Aim a quarter of the way along the deck, not at the very tip — landing
        // on the near edge leaves no margin either side.
        const aimZ = _hopZ - LOG_LEN * 0.28;
        const t = clamp((pz - aimZ) / Math.max(fwd, 1), 0.14, 1.3);
        const target = terrainHeight(_hopX, aimZ) + LOG_H;
        vy = clamp((target - player.position.y - 0.5 * GRAVITY * t * t) / t, JUMP_POP * 0.35, HOP_VY_MAX);
        hopX = _hopX;
        hopT = t + 0.35;                       // lateral help only until it lands
      } else {
        vy = Math.max(vy, 0) + JUMP_POP;
      }
      whoosh();
      burst(isTouch ? 6 : 12, 2.5);
    } else if (state === 'ride') {
      // ballistic look-ahead: if a free-fall arc would clear the slope, launch
      const LA = 0.10;
      const ax = px + vx * LA, az = pz - fwd * LA;
      const arc = gy + vy * LA + 0.5 * GRAVITY * LA * LA;
      if (arc > groundAt(ax, az) + 0.28) {
        grounded = false;
        spinAxis = armedT > 0 ? armedSpin : 0;
      }
    }
  } else {
    vy += GRAVITY * dt;
    player.position.y += vy * dt;
    // Holding rotates; releasing eases to the nearest whole turn.
    if (state === 'ride' && jumpHeld) {
      if (spinAxis === 0) flipRot += FLIP_RATE * dt;
      else rollRot += spinAxis * ROLL_RATE * dt;
    } else if (state === 'ride') {
      flipRot = settleSpin(flipRot, dt);
      rollRot = settleSpin(rollRot, dt);
    }
    if (player.position.y <= gy) {
      player.position.y = gy;
      // Skimming up a ramp face is not a landing — judging it as one crashed you
      // a fraction of a second after taking off.
      if (vy <= 0) {
        if (state === 'ride') land(vy); else { grounded = true; vy = 0; }
      }
    } else if (state === 'ride' && vy <= 0 && player.position.y <= logY + 0.75 &&
               player.position.y > logY - 2.4 && logUnder(px, pz, LOG_R + 2.4)) {
      // dropped onto a log — start grinding
      grinding = true;
      grindX = _logX;
      player.position.x = damp(player.position.x, _logX, 30, dt);   // pull onto the line
      grindEndZ = _logEndZ;
      grindAcc = 0;
      player.position.y = logY;
      vy = 0;
      flipRot = 0; rollRot = 0; spinAxis = 0;
      compress = Math.min(1, compress + 0.4);
      shake = Math.max(shake, 0.09);
      thud(0.5);
    }
  }
  jumpPressed = false;

  /* ---- obstacle collision ---- */
  if (graceT > 0) graceT -= dt;
  if (springT > 0) springT -= dt;
  // Only a square hit at snow level is fatal. Clipping the side of a log while
  // trying for a grind used to kill outright, which made every attempt a gamble.
  if (state === 'ride' && graceT <= 0 && springT <= 0 && !grinding &&
      player.position.y < terrainHeight(px, pz) + LOG_H - 0.75 &&
      logUnder(px, pz, LOG_R * 0.8)) {
    doCrash(); return;
  }
  if (state === 'ride' && graceT <= 0 && springT <= 0 && !grinding) {
    // Height is a range, not a point: at 42 u/s the rider can cross an obstacle's
    // crown inside a single frame, so test the band swept during the step.
    const hNow = player.position.y - terrainHeight(px, pz);
    const hPrev = py0 - terrainHeight(px0, pz0);
    const hHi = hNow > hPrev ? hNow : hPrev;
    const hLo = hNow > hPrev ? hPrev : hNow;

    for (let i = 0; i < chunks.length; i++) {
      const c = chunks[i];
      if (Math.abs(c.cz - pz) > CHUNK_D * 0.6 + 8) continue;

      for (let t = 0; t < c.tn; t++) {
        const s = c.ts[t];
        const top = 5.4 * s;
        if (hLo > top) continue;                                // sailed clean over
        const r = 0.72 * s + 0.5;
        if (sweptDistSq(px0, pz0, px, pz, c.tx[t], c.tz[t]) >= r * r) continue;
        // clipping the crown springs you higher instead of killing you
        if (!grounded && hHi > top * (1 - TREE_TOP)) { springOff(TREE_POP, 0.9); continue; }
        doCrash(); return;
      }

      for (let t = 0; t < c.rn; t++) {
        const s = c.rs[t];
        const top = 1.05 * s;
        if (hLo > top + 0.9) continue;                          // well above it
        const r = 0.82 * s + 0.5;
        if (sweptDistSq(px0, pz0, px, pz, c.rx[t], c.rz[t]) >= r * r) continue;
        // catching the crown of a rock is a bounce, not a wipeout
        if (!grounded && hHi > top - 0.5) {
          springOff(Math.max(-vy * ROCK_BOUNCE, ROCK_POP), 0.55);
          continue;
        }
        doCrash(); return;
      }
    }
  }
}

// Ease a free rotation toward the nearest whole turn. Without this, letting go
// mid-spin leaves you at an angle that is neither upright nor a completed trick,
// which made every hold longer than ~90ms an unavoidable crash. Past a half turn
// it carries you round to a full one; under that it straightens you up.
function settleSpin(a, dt) {
  const target = Math.round(a / 360) * 360;
  const d = target - a;
  const ad = Math.abs(d);
  if (ad < 0.5) return target;
  const step = clamp(ad * SETTLE_RATE, SETTLE_MIN, SETTLE_MAX) * dt;
  return ad <= step ? target : a + Math.sign(d) * step;
}

// Squared distance from an obstacle centre to this frame's travel segment.
// A point test would tunnel: at 42 u/s with dt clamped to 50ms the rider
// advances 2.1 units per step, wider than a tree's hit radius.
function sweptDistSq(ax, az, bx, bz, cx, cz) {
  const dx = bx - ax, dz = bz - az;
  const l2 = dx * dx + dz * dz;
  let t = l2 > 1e-9 ? ((cx - ax) * dx + (cz - az) * dz) / l2 : 0;
  if (t < 0) t = 0; else if (t > 1) t = 1;
  const qx = ax + dx * t - cx, qz = az + dz * t - cz;
  return qx * qx + qz * qz;
}

/* ---------------------------- visual response --------------------------- */

function poseBoard(dt) {
  if (state === 'crash') {
    flip.rotation.x += 7.2 * dt;
    bank.rotation.z += 4.4 * dt;
    compress = Math.min(1, compress + dt * 2.5);
    poseRider(dt, 0, false, compress);
    return;
  }

  const bankTgt = clamp(vx / STEER_MAX, -1, 1) * BANK_MAX;
  bankCur = damp(bankCur, bankTgt, BANK_RATE, dt);
  bank.rotation.z = -bankCur - rollRot * Math.PI / 180;
  flip.rotation.x = -flipRot * Math.PI / 180;

  compress = Math.max(0, compress - dt * 3.2);
  poseRider(dt, clamp(vx / STEER_MAX, -1, 1), !grounded, compress);

  if (grounded) terrainNormal(player.position.x, player.position.z, _norm);
  else _norm.copy(_up);
  _qAlign.setFromUnitVectors(_up, _norm);
  const yaw = -Math.atan2(vx, Math.max(fwd, 1)) * 0.55;
  _qYaw.setFromAxisAngle(_up, yaw);
  _qTgt.copy(_qAlign).multiply(_qYaw);
  player.quaternion.slerp(_qTgt, 1 - Math.exp(-ALIGN_RATE * dt));
}

/* -------------------------------- camera -------------------------------- */

function updateCamera(dt, raw) {
  // Vertical FOV means a portrait viewport shows mostly sky. Pitch down and pull
  // up as the frame gets taller so the slope keeps filling it.
  const tall = clamp((1.25 - camera.aspect) / 0.85, 0, 1);
  const dist = 10.4 + spdT * 4.6 + (state === 'crash' ? 2.5 : 0);
  const high = 5.6 + spdT * 1.5 + tall * 2.2;

  const wantX = player.position.x;          // lag comes from the damping, not an offset
  const wantY = player.position.y + high;
  const wantZ = player.position.z + dist;

  camLagX = damp(camLagX, wantX, 3.4, dt);
  camLagY = damp(camLagY, wantY, 6.5, dt);
  camLagZ = damp(camLagZ, wantZ, 7.5, dt);

  const minY = terrainHeight(camLagX, camLagZ) + 2.6;
  const cy = Math.max(camLagY, minY);

  camera.position.set(
    camLagX + Math.sin(realT * 61.0) * shake,
    cy + Math.sin(realT * 47.3 + 1.7) * shake,
    camLagZ + Math.sin(realT * 39.1 + 3.1) * shake * 0.5
  );

  camTgtX = damp(camTgtX, player.position.x, 4.2, dt);
  camTgtY = damp(camTgtY, player.position.y + 2.6 - tall * 6.4, 6.0, dt);
  camTgtZ = damp(camTgtZ, player.position.z - 17, 7.0, dt);
  camera.lookAt(camTgtX, camTgtY, camTgtZ);

  const fovWant = (62 + spdT * 10 + (slowT > 0 ? -4 : 0)) * (1 - tall * 0.12);
  camFov = damp(camFov, fovWant, 3.0, raw);
  if (Math.abs(camera.fov - camFov) > 0.01) {
    camera.fov = camFov;
    camera.updateProjectionMatrix();
  }

  shake *= Math.exp(-9 * raw);
  if (shake < 0.0005) shake = 0;
}

/* -------------------------------- trail --------------------------------- */

// Trail and spray vertices are stored relative to an origin object: after
// 30k units of descent, absolute world coords lose float32 precision.
function rebase(obj, origin, arr, count) {
  if (Math.abs(player.position.z - origin.z) < 300 && Math.abs(player.position.y - origin.y) < 300) return;
  const dx = player.position.x - origin.x, dy = player.position.y - origin.y, dz = player.position.z - origin.z;
  for (let i = 0; i < count; i++) { arr[i * 3] -= dx; arr[i * 3 + 1] -= dy; arr[i * 3 + 2] -= dz; }
  origin.copy(player.position);
  obj.position.copy(origin);
}

function updateTrail(dt) {
  rebase(trail, trailOrigin, trailPos, TRAIL_N * 2);

  const decay = Math.exp(-dt / 2.4);
  for (let i = 0; i < TRAIL_N * 2; i++) trailA[i] *= decay;

  trailAccum += fwd * dt;
  const lay = grounded && state !== 'crash';
  if (trailAccum >= TRAIL_STEP) {
    trailAccum %= TRAIL_STEP;
    trailPos.copyWithin(0, 6);
    trailA.copyWithin(0, 2);
  }

  _right.set(1, 0, 0).applyQuaternion(player.quaternion);
  const w = 0.24 + Math.abs(vx) * 0.015;
  const px = player.position.x, pz = player.position.z;
  const lx = px - _right.x * w, lz = pz - _right.z * w;
  const rx = px + _right.x * w, rz = pz + _right.z * w;
  const base = (TRAIL_N - 1) * 2;

  trailPos[base * 3]     = lx - trailOrigin.x;
  trailPos[base * 3 + 1] = terrainHeight(lx, lz) + 0.06 - trailOrigin.y;
  trailPos[base * 3 + 2] = lz - trailOrigin.z;
  trailPos[(base + 1) * 3]     = rx - trailOrigin.x;
  trailPos[(base + 1) * 3 + 1] = terrainHeight(rx, rz) + 0.06 - trailOrigin.y;
  trailPos[(base + 1) * 3 + 2] = rz - trailOrigin.z;
  trailA[base] = lay ? 1 : 0;
  trailA[base + 1] = lay ? 1 : 0;

  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.aAlpha.needsUpdate = true;
}

/* ------------------------------- particles ------------------------------ */

function updateSpray(dt) {
  rebase(spray, sprayOrigin, sprayPos, SPRAY_N);

  // emission from the edge of the board
  if (grounded && state !== 'crash') {
    const turn = Math.abs(vx) / STEER_MAX;
    const rate = (6 + fwd * 0.9) * (0.22 + turn * 1.5);
    sprayAcc += rate * dt;
    let guard = 0;
    _right.set(1, 0, 0).applyQuaternion(player.quaternion);
    while (sprayAcc >= 1 && guard++ < 10) {
      sprayAcc -= 1;
      const side = vx === 0 ? (Math.random() < 0.5 ? -1 : 1) : -Math.sign(vx);
      const off = 0.35 + Math.random() * 0.35;
      emitSpray(
        player.position.x + _right.x * side * off + (Math.random() - 0.5) * 0.4,
        player.position.y + 0.1 + Math.random() * 0.2,
        player.position.z + _right.z * side * off + (Math.random() - 0.5) * 0.6 + 0.6,
        side * (0.6 + turn * 4.2) * (0.4 + Math.random()),
        0.9 + Math.random() * (1.4 + turn * 3.2),
        (0.6 + Math.random() * 1.6) + fwd * 0.10,
        0.07 + Math.random() * 0.13 + turn * 0.06,
        0.35 + Math.random() * 0.55
      );
    }
  }

  for (let i = 0; i < SPRAY_N; i++) {
    if (sprayLife[i] <= 0) { if (sprayA[i] !== 0) sprayA[i] = 0; continue; }
    sprayLife[i] -= dt;
    if (sprayLife[i] <= 0) { sprayA[i] = 0; sprayS[i] = 0; continue; }
    const i3 = i * 3;
    sprayVel[i3 + 1] -= 13 * dt;
    const drag = 1 - Math.min(0.6, 2.6 * dt);
    sprayVel[i3] *= drag; sprayVel[i3 + 1] *= drag; sprayVel[i3 + 2] *= drag;
    sprayPos[i3] += sprayVel[i3] * dt;
    sprayPos[i3 + 1] += sprayVel[i3 + 1] * dt;
    sprayPos[i3 + 2] += sprayVel[i3 + 2] * dt;
    sprayA[i] = clamp(sprayLife[i] / sprayMax[i], 0, 1) * 0.85;
  }
  sprayGeo.attributes.position.needsUpdate = true;
  sprayGeo.attributes.aAlpha.needsUpdate = true;
  sprayGeo.attributes.aSize.needsUpdate = true;
}

function updateWeatherSnow(dt, dx, dy, dz) {
  if (!wsnow.visible) return;
  wsnow.position.copy(player.position);
  const drift = wWind;
  const span = WSNOW_R * 2, ySpan = WSNOW_YHI - WSNOW_YLO;
  for (let i = 0; i < wsVisible; i++) {
    const i3 = i * 3;
    let x = wsPos[i3] - dx + (drift + Math.sin(realT * 1.3 + wsPhase[i]) * (0.5 + drift * 0.4)) * dt;
    let y = wsPos[i3 + 1] - dy - wsFall[i] * dt;
    let z = wsPos[i3 + 2] - dz;
    if (x > WSNOW_R) x -= span; else if (x < -WSNOW_R) x += span;
    if (z > WSNOW_R) z -= span; else if (z < -WSNOW_R) z += span;
    if (y < WSNOW_YLO) y += ySpan; else if (y > WSNOW_YHI) y -= ySpan;
    wsPos[i3] = x; wsPos[i3 + 1] = y; wsPos[i3 + 2] = z;
  }
  wsGeo.attributes.position.needsUpdate = true;
}

function updateSpeedLines(dt) {
  const op = smoothstep(spdT, 0.48, 1.0) * 0.30;
  slMat.opacity = op;
  speedLines.visible = op > 0.004;
  if (!speedLines.visible) return;
  const len = 6 + spdT * 16;
  const travel = (24 + fwd * 1.4) * dt;
  for (let i = 0; i < SL_N; i++) {
    slZ[i] += travel;
    if (slZ[i] > -1.2) slZ[i] -= 34;
    const c = Math.cos(slAng[i]) * slRad[i], s = Math.sin(slAng[i]) * slRad[i];
    const z0 = slZ[i], z1 = slZ[i] - len;
    const k = i * 6;
    slPos[k] = c; slPos[k + 1] = s; slPos[k + 2] = z0;
    slPos[k + 3] = c; slPos[k + 4] = s; slPos[k + 5] = z1;
  }
  slGeo.attributes.position.needsUpdate = true;
}

/* -------------------------------- audio --------------------------------- */

function updateAudio(dt) {
  if (!actx || actx.state !== 'running') return;
  const turnNow = grounded && state !== 'crash' ? Math.abs(vx) / STEER_MAX : 0;
  updateMusic(dt, spdT, turnNow);
  const air = grounded ? 0 : 0.35;
  const wg = (0.05 + spdT * 0.24 + air * 0.12) * (state === 'title' ? 0.45 : 1);
  windGain.gain.value = lerp(windGain.gain.value, wg, Math.min(1, dt * 5));
  windFilt.frequency.value = lerp(windFilt.frequency.value, 240 + spdT * 900 + air * 400, Math.min(1, dt * 5));

  const turn = grounded && state !== 'crash' ? Math.abs(vx) / STEER_MAX : 0;
  const cg = turn * turn * 0.20 * (0.3 + spdT * 0.9);
  carveGain.gain.value = lerp(carveGain.gain.value, cg, Math.min(1, dt * 8));
  carveFilt.frequency.value = lerp(carveFilt.frequency.value, 900 + turn * 2600 + spdT * 700, Math.min(1, dt * 6));
}

/* --------------------------------- HUD ---------------------------------- */

function updateHUD(raw) {
  hudAcc += raw;
  if (hudAcc < 0.08) return;
  hudAcc = 0;
  const s = Math.floor(score);
  const st = s.toLocaleString('en-US');
  if (st !== lastScoreTxt) { el.score.textContent = st; lastScoreTxt = st; }
  if (s > bestScore) {
    bestScore = s;
    el.best.textContent = st;
  }
  const dt2 = Math.floor(distance) + ' M';
  if (dt2 !== lastDistTxt) { el.dist.textContent = dt2; lastDistTxt = dt2; }
  const mt = chain > 0 ? 'chain ×' + chain : '×' + mult;
  if (mt !== lastMultTxt) { el.mult.textContent = mt; lastMultTxt = mt; }
  if (mult > 1 || chain > 0) el.mult.classList.add('on');
  else el.mult.classList.remove('on');
}

/* ====================================================================== */
/*  MAIN LOOP                                                              */
/* ====================================================================== */

let last = performance.now();

function frame(now) {
  requestAnimationFrame(frame);

  let raw = (now - last) / 1000;
  last = now;
  if (!(raw > 0)) raw = 0.016;
  if (raw > 0.05) raw = 0.05;
  realT += raw;

  if (state === 'title') {
    drawTitle(realT, raw);
  } else if (state !== 'paused') {
    dayT = (dayT + raw / DAY_LEN) % 1;
  }

  if (slowT > 0) {
    slowT -= raw;
    timeScale = damp(timeScale, 0.34, 14, raw);
  } else {
    timeScale = damp(timeScale, 1, 5, raw);
  }
  const paused = state === 'wiped' || state === 'board' || state === 'paused';
  const dt = paused ? 0 : raw * timeScale;

  if (state === 'crash') {
    crashT -= raw;
    if (crashT <= 0) showWipe();
  }

  if (tiltOn) {
    if (state === 'wiped' || state === 'board' || state === 'crash') tiltSettle = 0.6;
    if (tiltSettle > 0) {
      tiltSettle -= raw;              // raw, so it still runs while the sim is paused
      tiltBase = tiltRaw;
      tiltAngle = 0;
    }
  }

  const px0 = player.position.x, py0 = player.position.y, pz0 = player.position.z;

  simulate(dt);
  spdT = clamp((fwd - SPD_BASE) / (SPD_MAX - SPD_BASE), 0, 1);
  poseBoard(dt);
  updateChunks(player.position.z);
  updateCamera(dt, raw);
  updateTrail(dt);
  updateSpray(dt);
  updateWeather(raw);
  updateWeatherSnow(dt, player.position.x - px0, player.position.y - py0, player.position.z - pz0);
  updateSpeedLines(dt);
  applyDay(dayT);

  // fog follows sky + weather
  scene.fog.color.copy(skyBot);
  scene.fog.far = damp(scene.fog.far, FOG_BASE * wFog, 1.2, raw);
  scene.fog.near = scene.fog.far * 0.10;

  // sky, stars, sun and mountains ride with the camera
  skyMesh.position.copy(camera.position);
  stars.position.copy(camera.position);
  horizon.position.copy(camera.position);
  sunSprite.position.copy(sunDir).multiplyScalar(3600).add(camera.position);
  moonSprite.position.copy(sunDir).multiplyScalar(3600).add(camera.position);
  for (let m = 0; m < mtnMeshes.length; m++) {
    const L = MTN_LAYERS[m];
    mtnMeshes[m].position.x = -camera.position.x * L.px;
    mtnMeshes[m].position.y = -camera.position.y * L.py;
  }

  if (hitFlash > 0) {
    hitFlash = Math.max(0, hitFlash - raw * 2.2);
    el.flash.style.opacity = (hitFlash * 0.45).toFixed(3);
  } else if (el.flash.style.opacity !== '0') {
    el.flash.style.opacity = '0';
  }

  updateAudio(raw);
  if (state !== 'title') updateHUD(raw);

  renderer.render(scene, camera);
}

/* ---------------------------- shareable card ---------------------------- */

// Renders the best run as a JPEG, reusing the title screen's dawn palette.
function saveCard() {
  const r = runs[0];
  if (!r) return;
  const W = 1080, H = 1350;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');

  const sky = c.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0.00, '#17203f');
  sky.addColorStop(0.36, '#3d3560');
  sky.addColorStop(0.66, '#8d5a76');
  sky.addColorStop(0.86, '#e7947f');
  sky.addColorStop(1.00, '#f8c39c');
  c.fillStyle = sky; c.fillRect(0, 0, W, H);

  const sg = c.createRadialGradient(W * 0.70, H * 0.80, 0, W * 0.70, H * 0.80, H * 0.42);
  sg.addColorStop(0, 'rgba(255,226,190,0.55)');
  sg.addColorStop(0.3, 'rgba(255,180,150,0.18)');
  sg.addColorStop(1, 'rgba(255,150,140,0)');
  c.fillStyle = sg; c.fillRect(0, 0, W, H);

  for (let i = 0; i < TITLE_LAYERS.length; i++) {
    const L = TITLE_LAYERS[i];
    const base = H * L.y, amp = H * L.h * 0.42;
    c.beginPath();
    c.moveTo(-8, H + 2);
    for (let x = -8; x <= W + 8; x += 7) c.lineTo(x, base - ridgeAt(x / W, L.seed, L.fq) * amp);
    c.lineTo(W + 8, H + 2);
    c.closePath();
    c.fillStyle = L.col; c.fill();
  }

  c.textAlign = 'center';
  c.fillStyle = '#fdf3ef';

  c.font = '200 46px ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif';
  c.letterSpacing = '18px';
  c.fillText('ALL DOWN HILL', W / 2 + 9, 150);

  c.letterSpacing = '10px';
  c.font = '300 20px ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif';
  c.globalAlpha = 0.55;
  c.fillText('BEST RUN', W / 2 + 5, 300);
  c.globalAlpha = 1;

  c.letterSpacing = '0px';
  c.font = '200 210px ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif';
  c.fillText(r.s.toLocaleString('en-US'), W / 2, 470);

  c.letterSpacing = '12px';
  c.font = '300 26px ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif';
  c.globalAlpha = 0.78;
  c.fillText(r.d + ' M   ·   ×' + r.m, W / 2 + 6, 545);

  c.font = '300 17px ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif';
  c.globalAlpha = 0.42;
  c.letterSpacing = '8px';
  c.fillText(new Date(r.t).toLocaleDateString('en-US',
    { year: 'numeric', month: 'short', day: 'numeric' }).toUpperCase(), W / 2 + 4, 600);

  c.globalAlpha = 0.5;
  c.font = '300 15px ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif';
  c.letterSpacing = '6px';
  c.fillText(location.host + location.pathname, W / 2 + 3, H - 54);

  const a = document.createElement('a');
  a.href = cv.toDataURL('image/jpeg', 0.92);
  a.download = 'all-down-hill-' + r.s + '.jpg';
  a.click();
}

function bindBtn(btn, fn) {
  btn.addEventListener('click', fn);
  // Direct touch binding as well: if anything ever swallows the synthetic click
  // again, the panel must still be escapable on a phone.
  btn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); fn(); }, { passive: false });
}
bindBtn(el.btnY, keepGoing);
bindBtn(el.btnN, endRun);
bindBtn(el.btnAgain, newRun);
bindBtn(el.btnResume, resumeGame);
el.pause.addEventListener('click', resumeGame);
el.pause.addEventListener('touchend', e => { e.preventDefault(); resumeGame(); }, { passive: false });
bindBtn(el.btnCard, saveCard);

window.addEventListener('keydown', e => {
  if (state === 'ride' && (e.code === 'Enter' || e.code === 'Escape')) { e.preventDefault(); pauseGame(); return; }
  if (state === 'paused') {
    if (e.code === 'Enter' || e.code === 'Escape' || e.code === 'Space') { e.preventDefault(); resumeGame(); }
    return;
  }
  if (state === 'wiped') {
    if (e.code === 'KeyY' || e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); keepGoing(); }
    else if (e.code === 'KeyN' || e.code === 'Escape') { e.preventDefault(); endRun(); }
  } else if (state === 'board') {
    if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyY') { e.preventDefault(); newRun(); }
  }
}, { passive: false });

/* ------------------------------- resize --------------------------------- */

// iOS's layout viewport extends behind the browser chrome, so innerHeight
// overstates what you can actually see — the bottom of the scene (and the rider)
// ends up hidden under the nav bar. Drive everything off visualViewport.
function viewportH() {
  const vv = window.visualViewport;
  return Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
}
function viewportW() {
  const vv = window.visualViewport;
  return Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
}

function resize() {
  const w = viewportW(), h = viewportH();
  const root = document.documentElement.style;
  root.setProperty('--app-w', w + 'px');
  root.setProperty('--app-h', h + 'px');

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  sizeTitle();
}
window.addEventListener('resize', resize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resize);
  window.visualViewport.addEventListener('scroll', resize);   // chrome sliding in/out
}
window.addEventListener('orientationchange', () => {
  if (tiltOn) { needBaseline = true; tiltSettle = 0.6; }   // remap changes under the new angle
  setTimeout(resize, 120);
  setTimeout(resize, 400);           // iOS reports stale sizes right after the flip
});
resize();

/* -------------------------------- start --------------------------------- */

function startGame() {
  if (started) return;
  started = true;

  initAudio();

  state = 'ride';
  survivalT = 0; distance = 0; score = 0; mult = 1;
  el.title.classList.add('off');
  el.canvas.classList.add('on');
  el.hud.classList.add('on');
  setTimeout(() => { el.hint.classList.add('on'); }, 1100);
  setTimeout(() => { el.hint.classList.remove('on'); }, 6100);
  setTimeout(() => { el.title.style.display = 'none'; }, 1200);
}

window.addEventListener('keydown', e => {
  if (e.key === 'Tab' || e.metaKey || e.ctrlKey || e.altKey) return;
  startGame();
});
window.addEventListener('pointerdown', startGame);
window.addEventListener('touchstart', startGame, { passive: true });

// Arm tilt + audio from the first touchend — the gesture iOS actually accepts.
window.addEventListener('touchend', () => {
  if (!motionArmed) { motionArmed = true; setupMotion(); }
  initAudio();
}, { passive: true });

window.addEventListener('pagehide', saveBest);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    saveBest();
    clearInput();                    // a touch held across backgrounding never gets its touchend
    if (actx && actx.state === 'running') actx.suspend();
  } else {
    last = performance.now();
    if (tiltOn) { needBaseline = true; tiltSettle = 0.6; }
    if (actx && actx.state === 'suspended' && started) actx.resume();
  }
});

applyDay(0);
scene.fog.color.copy(skyBot);
requestAnimationFrame(frame);
</script>
